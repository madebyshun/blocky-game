<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Base Builders · BaseCity</title>
    <meta name="description" content="The real Base builders who build BaseCity 24/7. Download their voxel PFPs." />
    <meta property="og:title" content="The Base Builders of BaseCity" />
    <meta property="og:description" content="Real Base builders building BaseCity 24/7. Grab a voxel PFP." />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Inter:wght@500;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/site.css" />
    <link rel="stylesheet" href="/src/builders.css" />
  </head>
  <body>
    <header class="top">
      <h1>The Base Builders</h1>
      <p class="lede">Real Base builders build BaseCity 24/7, side by side with the Blockies that <span id="ticker">$BLOCKY</span> buys bring. Download any voxel PFP and wear it.</p>
      <div class="actions">
        <span class="count" id="count"></span>
      </div>
    </header>
    <main id="grid" class="grid" aria-live="polite"></main>
    <dialog id="profile" class="profile">
      <button class="close" aria-label="Close">×</button>
      <div class="profile-grid">
        <img width="512" height="512" alt="" />
        <div>
          <h2></h2>
          <div class="title"></div>
          <div class="status"></div>
          <dl></dl>
          <div class="row"><button class="btn primary dl">⬇ Download PFP</button><button class="btn share">Share on 𝕏</button></div>
        </div>
      </div>
    </dialog>
    <p class="wrap count">Voxel PFPs are free to use: download one and wear it.</p>
    <script type="module" src="/src/builders.js"></script>
  </body>
</html>
