<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Base Builders · BaseCity</title>
    <meta name="description" content="The real Base builders who build BaseCity 24/7. Download their voxel PFPs." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BaseCity" />
    <meta property="og:url" content="%SITE%/builders.html" />
    <meta property="og:title" content="The Base Builders of BaseCity" />
    <meta property="og:description" content="Real Base builders building BaseCity 24/7. Grab a voxel PFP." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@%X%" />
    <meta name="twitter:title" content="The Base Builders of BaseCity" />
    <meta name="twitter:description" content="Real Base builders building BaseCity 24/7. Grab a voxel PFP." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Inter:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/site.css" />
    <link rel="stylesheet" href="/src/builders.css" />
    <meta property="og:image" content="https://basecity.space/og-white/builders.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Built by Base Builders. Meet the people behind the city." />

    <meta name="twitter:image:alt" content="Built by Base Builders. Meet the people behind the city." />
  </head>
  <body>
    <header class="top">
      <h1>The Base Builders</h1>
      <p class="lede">Meet the builders shaping BaseCity. Browse their voxel portraits, see their contributions, and download a PFP.</p>
      <div class="actions">
        <span class="count" id="count"></span>
        <label class="builder-search"><span>Find a builder</span><input id="builder-search" type="search" autocomplete="off" placeholder="Name or role" /></label>
      </div>
    </header>
    <main id="grid" class="grid" aria-live="polite"></main>
    <p id="builder-empty" class="wrap" hidden>No builders match your search.</p>
    <dialog id="profile" class="profile" aria-labelledby="builder-name">
      <button class="close" aria-label="Close">×</button>
      <div class="profile-grid">
        <figure class="portrait">
          <img width="512" height="512" alt="" />
          <figcaption role="group" aria-label="Character view">
            <button type="button" data-view="portrait" aria-pressed="true">Portrait</button>
            <button type="button" data-view="full" aria-pressed="false">Full body</button>
          </figcaption>
        </figure>
        <div>
          <h2 id="builder-name"></h2>
          <div class="title"></div>
          <div class="status"></div>
          <dl></dl>
          <div class="row"><button class="btn primary dl">⬇ Download PFP</button><button class="btn share">Share on 𝕏</button></div>
          <a class="btn view-3d">Open 3D viewer</a>
        </div>
      </div>
    </dialog>
    <script type="module" src="/src/builders.js"></script>
  </body>
</html>
