<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dashboard maker · BaseCity</title>
    <meta name="description" content="Paste a link or a long post: get a bento dashboard of its key numbers, ready to share." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/site.css" />
    <link rel="stylesheet" href="/src/basebento.css" />
    <link rel="stylesheet" href="/src/dash.css" />
  </head>
  <body>
    <main class="bb-page">
      <section class="dm-make">
        <h1>Dashboard maker</h1>
        <p class="dm-sub">Paste a link (a post on X, an article) or the text itself. Claude lays out its key numbers as a bento board: only what the source says.</p>
        <form id="dm-form">
          <input id="dm-url" placeholder="https://x.com/base/status/…" autocomplete="off" />
          <textarea id="dm-text" rows="5" placeholder="…or paste a long post here"></textarea>
          <button class="btn primary" id="dm-go">Build dashboard</button>
          <p class="dm-msg" id="dm-msg"></p>
        </form>
      </section>
      <div class="bb-bar" id="dm-bar" hidden>
        <p class="bb-kicker" id="dm-src"></p>
        <div class="bb-actions"><button class="btn" id="dm-copy">Copy link</button><button class="btn" id="dm-save">Save image</button><a class="btn primary" id="dm-share" target="_blank" rel="noopener">Share on X</a></div>
      </div>
      <div class="bb-fit" id="dm-fit" hidden><section class="bb dm" id="dm-board"></section></div>
      <section class="dm-gallery"><h2>Dashboards made</h2><div id="dm-list" class="dm-list"></div></section>
    </main>
    <script type="module" src="/src/dash.js"></script>
  </body>
</html>
